<!DOCTYPE html>
<html lang="en" data-theme="matrix">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00ff8c" />
  <title>Profile Settings — KingBot V8.7 Platform | GIBSONFX TECH</title>
  <meta name="description" content="Manage your KingBot V8.7 account: theme preferences, notification settings, security, phone verification, and password." />
  <link rel="manifest" href="manifest/manifest.webmanifest" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <div class="wrap" id="app">
    <section class="section" style="padding-top:24px">
      <div class="sec-head">
        <div class="eyebrow">// Profile</div>
        <h1>Account Settings</h1>
        <p>Manage your theme, notifications, security, and personal preferences.</p>
      </div>

      <div class="dash-grid">
        <!-- Left column -->
        <div class="dash-col-main">

          <!-- Profile info -->
          <div class="panel">
            <div class="panel-head"><h3>Profile</h3></div>
            <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px">
              <div class="avatar" id="avatar">KB</div>
              <div>
                <div style="font-size:18px;font-weight:700" id="displayName">—</div>
                <div class="text-dim" style="font-size:13px" id="emailDisplay">—</div>
                <div class="text-dim" style="font-size:13px" id="phoneDisplay">—</div>
              </div>
            </div>
            <div class="field">
              <label>Display name</label>
              <input id="displayNameInput" placeholder="Your name" />
            </div>
            <button class="btn btn-primary" id="saveProfileBtn" style="margin-top:12px">Save profile</button>
          </div>

          <!-- Theme picker -->
          <div class="panel">
            <div class="panel-head"><h3>Theme</h3></div>
            <p class="text-dim" style="font-size:13px;margin:0 0 16px">Choose your high-tech aesthetic. The Matrix theme is the signature KingBot look.</p>
            <div class="theme-grid" id="themeGrid"></div>
          </div>

          <!-- Notifications -->
          <div class="panel">
            <div class="panel-head"><h3>Notifications</h3></div>
            <div id="notifList"></div>
          </div>

        </div>

        <!-- Right column -->
        <div class="dash-col-side">

          <!-- Subscription card -->
          <div class="panel">
            <div class="panel-head"><h3>Subscription</h3></div>
            <div id="subInfo"></div>
          </div>

          <!-- Security -->
          <div class="panel">
            <div class="panel-head"><h3>Security</h3></div>
            <div id="securityList"></div>
            <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px">
              <div class="field">
                <label>Change password</label>
                <input id="newPassword" type="password" placeholder="New password" style="margin-bottom:8px" />
                <input id="newPasswordConfirm" type="password" placeholder="Confirm new password" />
              </div>
              <button class="btn btn-primary" id="changePassBtn" style="margin-top:8px;width:100%">Update password</button>
            </div>
          </div>

          <!-- Activity log -->
          <div class="panel">
            <div class="panel-head"><h3>Recent Activity</h3></div>
            <div id="activityLog" style="max-height:260px;overflow-y:auto"></div>
          </div>

        </div>
      </div>
    </section>
  </div>

  <script>
    (function () {
      if (!KB.requireAuth()) return;
      KB.mountShell("profile");

      let user = KB.getUser() || {};
      let notifSettings = { tradeAlerts: true, drawdownAlerts: true, weeklyReport: true, productUpdates: false };

      async function init() {
        // Fetch fresh profile
        try {
          const me = await KB.api.get("/api/auth/me");
          user = me.user || me;
          KB.setSession(localStorage.getItem("kingbot_token"), user);
        } catch { /* use cached */ }
        renderProfile();
        renderThemes();
        renderNotifs();
        renderSecurity();
        await renderSubscription();
        await renderActivity();
      }

      function renderProfile() {
        const name = user.displayName || user.email?.split("@")[0] || "Trader";
        document.getElementById("displayName").textContent = name;
        document.getElementById("emailDisplay").textContent = user.email || "—";
        document.getElementById("phoneDisplay").textContent = user.phone || "—";
        document.getElementById("avatar").textContent = (name[0] || "K").toUpperCase();
        document.getElementById("displayNameInput").value = user.displayName || "";
      }

      function renderThemes() {
        const cur = localStorage.getItem("kingbot_theme") || "matrix";
        const grid = document.getElementById("themeGrid");
        grid.innerHTML = KB.THEMES.map(t => {
          const meta = KB.THEME_META[t];
          return `<div class="theme-opt ${t === cur ? "active" : ""}" data-theme="${t}">
            <div class="swatch">
              <span style="background:${meta.colors[0]}"></span>
              <span style="background:${meta.colors[1]}"></span>
            </div>
            <div class="name">${meta.name}</div>
          </div>`;
        }).join("");
        grid.querySelectorAll(".theme-opt").forEach(el => {
          el.onclick = () => {
            KB.applyTheme(el.dataset.theme);
            grid.querySelectorAll(".theme-opt").forEach(x => x.classList.remove("active"));
            el.classList.add("active");
            // sync to backend
            KB.api.patch("/api/profile/me", { theme: el.dataset.theme }).catch(() => {});
            KB.toast(`Theme: ${KB.THEME_META[el.dataset.theme].name}`);
          };
        });
      }

      function renderNotifs() {
        const items = [
          ["tradeAlerts", "Trade alerts", "Get notified when the EA opens or closes a trade"],
          ["drawdownAlerts", "Drawdown alerts", "Warn me when drawdown exceeds safe levels"],
          ["weeklyReport", "Weekly performance report", "Email summary of your weekly trading stats"],
          ["productUpdates", "Product updates", "News about KingBot features and EA updates"],
        ];
        const list = document.getElementById("notifList");
        list.innerHTML = items.map(([key, title, desc]) => `
          <div class="setting-row" style="padding:12px 0">
            <div><strong style="font-size:13px">${title}</strong><div class="text-dim" style="font-size:12px;margin-top:2px">${desc}</div></div>
            <label class="switch">
              <input type="checkbox" id="notif-${key}" ${notifSettings[key] ? "checked" : ""} />
              <span class="slider"></span>
            </label>
          </div>`).join("");
        items.forEach(([key]) => {
          const cb = document.getElementById("notif-" + key);
          if (cb) cb.onchange = () => {
            notifSettings[key] = cb.checked;
            KB.api.patch("/api/profile/me", { notifications: notifSettings }).catch(() => {});
            KB.toast("Notification preference saved");
          };
        });
      }

      function renderSecurity() {
        const items = [
          ["Email verification", user.emailVerified ? "Verified" : "Not verified", user.emailVerified],
          ["Phone (SMS OTP)", user.phoneVerified ? "Verified" : "Not verified", user.phoneVerified],
          ["Two-factor (SMS)", user.phoneVerified ? "Enabled" : "Enable phone first", user.phoneVerified],
          ["JWT session", "Active", true],
        ];
        document.getElementById("securityList").innerHTML = items.map(([label, val, ok]) => `
          <div class="setting-row">
            <span style="font-size:13px">${label}</span>
            <span class="pill ${ok ? "pill-ok" : "pill-warn"}">${val}</span>
          </div>`).join("");
      }

      async function renderSubscription() {
        const el = document.getElementById("subInfo");
        try {
          const me = await KB.api.get("/api/subscriptions/me");
          const sub = me.subscription;
          if (!sub || sub.status !== "active") {
            el.innerHTML = `<p class="text-dim" style="font-size:13px;margin:0 0 12px">No active subscription.</p><a href="pricing.html" class="btn btn-primary btn-sm">Subscribe now</a>`;
            return;
          }
          const licenses = sub.licenses || [];
          el.innerHTML = `
            <div class="setting-row"><span style="font-size:13px">Plan</span><span class="pill pill-ok">${(sub.planId || "basic").toUpperCase()}</span></div>
            <div class="setting-row"><span style="font-size:13px">Status</span><span class="pill pill-ok">${sub.status}</span></div>
            <div class="setting-row"><span style="font-size:13px">License keys</span><span class="mono" style="font-size:12px;color:var(--accent)">${licenses.length}</span></div>
            ${licenses.map(l => `<div class="setting-row"><span style="font-size:11px;color:var(--text-dim)">${l.label || "Account"}</span><span class="mono" style="font-size:11px">${l.key}</span></div>`).join("")}
            <div class="setting-row"><span style="font-size:13px">Renews</span><span class="text-dim" style="font-size:12px">${sub.currentPeriodEnd ? KB.fmtTime(sub.currentPeriodEnd) : "Monthly"}</span></div>
            <button class="btn btn-ghost btn-sm" id="cancelSubBtn" style="width:100%;margin-top:12px;color:var(--danger)">Cancel subscription</button>
          `;
          const cancelBtn = document.getElementById("cancelSubBtn");
          if (cancelBtn) cancelBtn.onclick = async () => {
            if (!confirm("Cancel your subscription? You'll keep access until the period ends.")) return;
            try {
              await KB.api.del("/api/subscriptions/me");
              KB.toast("Subscription cancelled");
              setTimeout(() => window.location.reload(), 1000);
            } catch (e) { KB.toast(e.message, true); }
          };
        } catch {
          el.innerHTML = '<p class="text-dim" style="font-size:13px">Unable to load subscription.</p>';
        }
      }

      async function renderActivity() {
        const el = document.getElementById("activityLog");
        try {
          const res = await KB.api.get("/api/profile/me/activity").catch(() => ({ activity: [] }));
          const acts = res.activity || [];
          if (acts.length === 0) {
            el.innerHTML = '<div class="text-dim" style="font-size:13px;padding:8px 0">No recent activity.</div>';
            return;
          }
          el.innerHTML = acts.slice(0, 10).map(a => `
            <div class="setting-row" style="padding:8px 0">
              <span style="font-size:12px">${KB.escapeHTML(a.action || a.type || "Activity")}</span>
              <span class="text-dim" style="font-size:11px">${a.timestamp ? KB.fmtTime(a.timestamp) : ""}</span>
            </div>`).join("");
        } catch {
          el.innerHTML = '<div class="text-dim" style="font-size:13px">Activity log unavailable.</div>';
        }
      }

      // ---- Save profile ----
      document.getElementById("saveProfileBtn").onclick = async () => {
        const name = document.getElementById("displayNameInput").value.trim();
        try {
          const res = await KB.api.patch("/api/profile/me", { displayName: name });
          user.displayName = name;
          KB.setSession(localStorage.getItem("kingbot_token"), { ...KB.getUser(), displayName: name });
          renderProfile();
          KB.toast("Profile saved");
        } catch (e) { KB.toast(e.message, true); }
      };

      // ---- Change password ----
      document.getElementById("changePassBtn").onclick = async () => {
        const pw = document.getElementById("newPassword").value;
        const pw2 = document.getElementById("newPasswordConfirm").value;
        if (pw.length < 8) { KB.toast("Password must be at least 8 characters", true); return; }
        if (pw !== pw2) { KB.toast("Passwords don't match", true); return; }
        try {
          await KB.api.patch("/api/profile/me/password", { newPassword: pw });
          document.getElementById("newPassword").value = "";
          document.getElementById("newPasswordConfirm").value = "";
          KB.toast("Password updated");
        } catch (e) { KB.toast(e.message, true); }
      };

      init();
    })();
  </script>
</body>
</html>
