<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff8c"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#02110a"/>
  <!-- Robot head outline -->
  <path d="M20 16 L44 16 L48 20 L48 42 C48 50 42 54 32 56 C22 54 16 50 16 42 L16 20 Z"
        fill="none" stroke="url(#g)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Eyes -->
  <circle cx="25" cy="30" r="4" fill="url(#g)" filter="url(#glow)"/>
  <circle cx="39" cy="30" r="4" fill="url(#g)" filter="url(#glow)"/>
  <!-- Mouth/grill -->
  <path d="M24 42 L40 42" stroke="url(#g)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M28 45 L36 45" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Antenna -->
  <line x1="32" y1="10" x2="32" y2="16" stroke="url(#g)" stroke-width="1.5"/>
  <circle cx="32" cy="9" r="2" fill="url(#g)" filter="url(#glow)"/>
</svg>
