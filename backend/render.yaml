# Render deployment config for KingBot V8.7 backend.
# Docs: https://render.com/docs/blueprint-spec
# After creating the service from this blueprint, add all .env variables in the
# Render dashboard (Environment tab) — see .env.example for the full list.

services:
  - type: web
    name: kingbot-platform-backend
    runtime: node
    plan: free # upgrade to 'starter' for production
    region: oregon # or frankfurt / singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    healthCheckInterval: 30
    healthCheckTimeout: 5
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true # Render auto-generates a secret
      - key: CORS_ORIGIN
        sync: false # set to your GitHub Pages URL in the dashboard (e.g., https://username.github.io)
      - key: MOCK_EA
        value: "true" # set false when you connect a real MT5 bridge
      - key: PAYMENTS_ENABLED
        value: "false" # set true + add Stripe keys when going live
      - key: EMAIL_ENABLED
        value: "false" # set true + add SMTP creds for email verification
      - key: SMS_ENABLED
        value: "false" # set true + add Twilio creds for phone OTP
      - key: AI_PROVIDER
        value: rule # or 'openai' + AI_API_KEY for the AI copilot
      - key: DATA_DIR
        value: ./data # ephemeral; swap for Postgres addon in production
